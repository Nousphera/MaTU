name: Source checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchvision==0.23.0
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m compileall -q src scripts
      - run: |
          python scripts/prepare_data.py --help
          python scripts/prepare_model.py --help
          python scripts/run_experiment.py --help
      - name: Check vector exchange
        run: |
          python - <<'PY'
          import numpy as np
          from matu.core import ClientUpdate, UnifiedVector, aggregate, unify
          vector = np.array([1., -2., 3.], dtype=np.float32)
          packet = UnifiedVector.from_bytes(unify({'task': vector}).to_bytes())
          np.testing.assert_array_equal(packet.reconstruct('task'), vector)
          output = aggregate([ClientUpdate(packet, {'task': 4})])
          np.testing.assert_array_equal(output['task'], vector)
          PY
